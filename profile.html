<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw your constellation | Written in the Stars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile.css">
</head>
<body>

  <!-- Twinkling background stars (made by profile.js) -->
  <div id="sky-bg" aria-hidden="true"></div>

  <main class="page">

    <!-- ========== TITLE ========== -->
    <header class="title-block">
      <h1>Draw your constellation</h1>
      <p id="subtitle" class="subtitle">Every star holds a piece of you. Light all six to step into the sky.</p>
    </header>

    <!-- ========== THE CONSTELLATION ========== -->
    <!-- The stars and lines get drawn here by profile.js -->
    <svg id="constellation" viewBox="0 0 600 400" aria-label="Your profile constellation. Each star is one question.">
      <defs>
        <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="5" />
        </filter>
        <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>
      <g id="links"></g>
      <g id="stars"></g>
    </svg>

    <p id="progress" class="progress" aria-live="polite"></p>

    <!-- ========== SHOWS BEFORE YOU PICK A STAR ========== -->
    <p id="intro" class="intro">Hover over a star to wake it up, then click or tap it to fill it in.</p>

    <!-- ========== QUESTION PANEL (one star at a time) ========== -->
    <section id="panel" class="panel" hidden>
      <button type="button" class="close" id="close-panel" aria-label="Close">&times;</button>
      <form id="star-form" novalidate>
        <p id="panel-step" class="step"></p>
        <h2 id="panel-question"></h2>
        <div id="panel-fields" class="fields"></div>
        <p id="panel-error" class="error" aria-live="polite"></p>
        <button type="submit" class="btn">Light this star</button>
      </form>
    </section>

    <!-- ========== SHOWS WHEN ALL STARS ARE LIT ========== -->
    <div id="done" class="done" hidden>
      <button type="button" class="btn big" id="enter-sky">Enter the sky</button>
      <p id="saved-msg" class="hint" aria-live="polite"></p>
    </div>

  </main>

  <script src="profile.js"></script>
</body>
</html>
